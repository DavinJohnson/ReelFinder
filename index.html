<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelFinder – Movie Discovery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <h1>ReelFinder</h1>
    <p class="tagline">Find your next movie.</p>
    <!-- TODO (UI/partner): nav for Home / Search / Watchlist views -->
  </header>

  <main id="main">
    <!-- SPA view: Home / Discovery. Other views (search, details, watchlist) get added here
         as sibling <section>s and are shown/hidden with jQuery. -->
    <section id="view-home" class="view" aria-labelledby="popular-heading">
      <h2 id="popular-heading">Popular Movies</h2>

      <!-- Status area: aria-live so screen readers announce loading/errors -->
      <div id="status" role="status" aria-live="polite"></div>

      <ul id="movie-grid" class="movie-grid"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
